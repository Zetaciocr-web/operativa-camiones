<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Operativa de Camiones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería ExcelJS para dar formato y estilos visuales al Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body class="bg-gray-100 p-3 min-h-screen">

  <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-5">
    <h1 class="text-xl font-bold text-gray-800 text-center mb-4">Operativa de Camiones</h1>
    
    <!-- Sección de Búsqueda -->
    <div class="mb-4 bg-blue-50 p-3 rounded-lg border border-blue-200">
      <label class="block text-xs font-bold text-blue-800 mb-1">BUSCAR REGISTRO GUARDADO:</label>
      <input type="text" id="buscador" placeholder="Escriba nombre, placa o contenedor..." 
             class="w-full p-2 mb-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm bg-white">
      <select id="selectConductor" class="w-full p-2 border rounded-lg bg-white text-sm">
        <option value="">-- Sin registros guardados --</option>
      </select>
    </div>

    <!-- Formulario de Registros -->
    <form id="formCamion" class="space-y-3">
      
      <div>
        <label class="block text-xs font-bold text-gray-700">CONDUCTOR</label>
        <input type="text" id="conductor" placeholder="Nombre completo" class="w-full p-2 border rounded text-sm focus:border-blue-500">
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700">PLACA</label>
          <input type="text" id="placa" placeholder="" class="w-full p-2 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">LICENCIA</label>
          <input type="text" id="licencia" placeholder="N° Licencia" class="w-full p-2 border rounded text-sm">
        </div>
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-xs font-bold text-gray-700">EXP</label>
          <input type="text" id="exp" placeholder="Ej. LP" class="w-full p-2 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">TEL</label>
          <input type="tel" id="tel" placeholder="Teléfono" class="w-full p-2 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">EMPRESA</label>
          <input type="text" id="empresa" placeholder="" class="w-full p-2 border rounded text-sm">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-blue-600">PRECINTO</label>
          <input type="text" id="precinto" placeholder="N° Precinto" class="w-full p-2 border rounded text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700">CONTENEDOR</label>
          <input type="text" id="contenedor" placeholder="N° Contenedor" class="w-full p-2 border rounded text-sm">
        </div>
      </div>

      <hr class="my-2">

      <!-- Sección de Pesos con Cálculo Automático -->
      <div class="grid grid-cols-3 gap-2 bg-blue-50/50 p-2 rounded-lg border border-blue-100">
        <div>
          <label class="block text-xs font-bold text-gray-600">PESO TARA</label>
          <input type="number" id="tara" step="any" placeholder="0.00" class="w-full p-2 border rounded text-sm bg-white">
        </div>
        <div>
          <label class="block text-xs font-bold text-blue-800">PESO NETO</label>
          <input type="number" id="neto" step="any" readonly placeholder="0.00" class="w-full p-2 border rounded text-sm bg-blue-100 font-bold text-blue-900 cursor-not-allowed">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-600">PESO BRUTO</label>
          <input type="number" id="bruto" step="any" placeholder="0.00" class="w-full p-2 border rounded text-sm bg-white">
        </div>
      </div>

      <!-- Estado Opcional (Llegó / No llegó) -->
      <div class="bg-gray-50 p-2 rounded-lg border border-gray-200">
        <label class="block text-xs font-bold text-gray-700 mb-1">ESTADO DE LLEGADA:</label>
        <div class="flex justify-around items-center pt-1">
          <label class="flex items-center space-x-1 cursor-pointer">
            <input type="radio" name="estado" id="llego" value="LLEGO" class="h-4 w-4 text-green-600">
            <span class="text-xs font-bold text-green-700">LLEGÓ</span>
          </label>
          <label class="flex items-center space-x-1 cursor-pointer">
            <input type="radio" name="estado" id="noLlego" value="NO LLEGO" class="h-4 w-4 text-red-600">
            <span class="text-xs font-bold text-red-700">NO LLEGÓ</span>
          </label>
          <label class="flex items-center space-x-1 cursor-pointer">
            <input type="radio" name="estado" id="ninguno" value="" checked class="h-4 w-4 text-gray-400">
            <span class="text-xs font-bold text-gray-500">SIN MARCAR</span>
          </label>
        </div>
      </div>

      <!-- Campo de Observaciones -->
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">OBSERVACIONES</label>
        <textarea id="observaciones" rows="2" placeholder="" class="w-full p-2 border rounded text-sm"></textarea>
      </div>

      <!-- Botón Guardar -->
      <button type="button" id="btnGuardar" class="w-full mt-3 bg-blue-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-blue-700 text-sm">
        Guardar Datos
      </button>

      <!-- Botones Secundarios -->
      <div class="grid grid-cols-3 gap-2 pt-1">
        <button type="button" id="btnLimpiar" class="bg-gray-500 text-white font-bold py-2 rounded-lg text-xs">
          Limpiar
        </button>
        <button type="button" id="btnBorrar" class="bg-red-600 text-white font-bold py-2 rounded-lg text-xs hover:bg-red-700">
          Borrar
        </button>
        <button type="button" id="btnExportar" class="bg-green-600 text-white font-bold py-2 rounded-lg text-xs hover:bg-green-700">
          Descargar Excel
        </button>
      </div>
    </form>
  </div>

  <!-- Enlace al módulo de Firebase -->
  <script type="module" src="app.js"></script>
</body>
</html>
