<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operativa de Camiones</title>

  <!-- Hojas de estilo -->
  <link rel="stylesheet" href="styles.css">

  <!-- Librería externa para exportar a Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body>

  <div class="container">
    <h2>OPERATIVA DE CAMIONES</h2>

    <!-- Buscador y selector -->
    <div class="field-group inline-group">
      <label for="buscador">Buscar Registro:</label>
      <input type="text" id="buscador" placeholder="Buscar por conductor, placa, contenedor...">
    </div>

    <div class="field-group inline-group">
      <label for="selectConductor">Registros Guardados:</label>
      <select id="selectConductor">
        <option value="">-- Cargando datos... --</option>
      </select>
    </div>

    <hr>

    <!-- Formulario principal -->
    <form id="formCamion" onsubmit="return false;">
      <div class="grid-form">
        <div class="field-group">
          <label for="conductor">Conductor:</label>
          <input type="text" id="conductor" placeholder="Nombre completo">
        </div>

        <div class="field-group">
          <label for="placa">Placa:</label>
          <input type="text" id="placa" placeholder="Ej: 1234-XYZ">
        </div>

        <div class="field-group">
          <label for="licencia">Licencia:</label>
          <input type="text" id="licencia" placeholder="Nro de Licencia">
        </div>

        <div class="field-group">
          <label for="exp">EXP:</label>
          <input type="text" id="exp" placeholder="Ej: LP">
        </div>

        <div class="field-group">
          <label for="tel">Teléfono:</label>
          <input type="text" id="tel" placeholder="Nro de contacto">
        </div>

        <div class="field-group">
          <label for="empresa">Empresa:</label>
          <input type="text" id="empresa" placeholder="Empresa de transporte">
        </div>

        <div class="field-group">
          <label for="precinto">Precinto:</label>
          <input type="text" id="precinto" placeholder="Nro de precinto">
        </div>

        <div class="field-group">
          <label for="contenedor">Contenedor:</label>
          <input type="text" id="contenedor" placeholder="Nro de contenedor">
        </div>

        <div class="field-group">
          <label for="tara">Peso Tara (kg):</label>
          <input type="number" step="0.01" id="tara" placeholder="0.00">
        </div>

        <div class="field-group">
          <label for="bruto">Peso Bruto (kg):</label>
          <input type="number" step="0.01" id="bruto" placeholder="0.00">
        </div>

        <div class="field-group">
          <label for="neto">Peso Neto (kg):</label>
          <input type="number" step="0.01" id="neto" placeholder="Calculado auto" readonly>
        </div>
      </div>

      <!-- Radios de Estado -->
      <div class="radio-group">
        <label><input type="radio" name="estado" id="llego" value="LLEGO"> LLEGÓ</label>
        <label><input type="radio" name="estado" id="noLlego" value="NO LLEGO"> NO LLEGÓ</label>
        <label><input type="radio" name="estado" id="ninguno" value="" checked> NINGUNO</label>
      </div>

      <div class="field-group">
        <label for="observaciones">Observaciones:</label>
        <textarea id="observaciones" rows="3" placeholder="Notas u observaciones adicionales..."></textarea>
      </div>

      <!-- Botones de Acción -->
      <div class="button-group">
        <button type="button" id="btnGuardar" class="btn btn-primary">Guardar / Actualizar</button>
        <button type="button" id="btnLimpiar" class="btn btn-secondary">Limpiar Formulario</button>
        <button type="button" id="btnBorrar" class="btn btn-danger">Eliminar Registro</button>
        <button type="button" id="btnExportar" class="btn btn-success">Exportar a Excel</button>
      </div>
    </form>
  </div>

  <!-- Archivo JavaScript principal -->
  <script type="module" src="app.js"></script>
</body>
</html>
